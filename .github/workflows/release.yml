# The update feed: pushing a v* tag builds the desktop app for macOS and
# Windows and uploads the installers to a draft release on this repo. The repo
# is public, so the feed baked into installed apps (publish in
# apps/desktop/electron-builder.yml, which must name this repo) stays
# anonymously readable. Publishing that draft is what makes running apps see
# the update. Bump apps/desktop/package.json's version to match the tag before
# tagging — that version is what installed apps compare against.
name: Release

on:
  push:
    tags: ["v*"]

# Both jobs write releases: the draft job creates one, electron-builder uploads
# into it. GITHUB_TOKEN can do that here because the release lives in this repo.
permissions:
  contents: write

jobs:
  # Both platform builders publish into one draft release. Created up front
  # because two electron-builder jobs racing to create it end up with two
  # drafts for the same tag, each holding half the assets. The draft needs no
  # checkout: the tag it names already exists and carries the commit.
  draft:
    runs-on: ubuntu-latest
    steps:
      - run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then exit 0; fi
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Web build
        run: pnpm --filter @marlen/web build

      - name: Package & upload to draft release
        run: pnpm --filter @marlen/desktop dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Never hunt the runner keychain for identities; builds ship
          # unsigned until the signing accounts exist. Signing env vars must
          # be ABSENT while unused — electron-builder treats even an empty
          # CSC_LINK as a certificate path and the build dies on it. How to
          # add them per platform: README → Signing.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
